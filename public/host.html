<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Differenzler-Jass - Kontrollblatt (Host)</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #f0fdf4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; color: #14532d; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #dcfce7; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 16px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; font-size: 26px; font-weight: 900; color: #14532d; }
        .sub-title { font-size: 12px; color: #4b5563; font-weight: bold; margin-top: 4px; }
        
        .host-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; color: white; transition: background 0.2s; }
        .btn-green { background-color: #166534; } .btn-green:hover { background-color: #14532d; }
        .btn-red { background-color: #991b1b; } .btn-red:hover { background-color: #7f1d1d; }
        .btn-blue { background-color: #1d4ed8; } .btn-blue:hover { background-color: #1e40af; }
        .btn-gray { background-color: #4b5563; } .btn-gray:hover { background-color: #374151; }
        .btn-lock-active { background-color: #b91c1c !important; }

        .info-panel { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .room-box { background: #166534; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 120px; }
        .room-code { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        
        .player-slot { background: #f9fafb; border: 2px solid #e5e7eb; padding: 10px 15px; border-radius: 10px; flex: 1; min-width: 180px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
        .player-status-dot { width: 12px; height: 12px; border-radius: 50%; background: #d1d5db; display: inline-block; }
        .connected { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.6); }

        /* TABELLEN DESIGN & PASSE-UNTERSCHEIDUNG */
        .passe-container { margin-bottom: 30px; border-radius: 12px; overflow: hidden; background: #fff; transition: all 0.3s; }
        .passe-inactive { border: 2px solid #e5e7eb; opacity: 0.75; }
        .passe-inactive .passe-header { background: #f3f4f6; color: #374151; }
        .passe-active { border: 3px solid #166534; box-shadow: 0 10px 15px -3px rgba(22, 101, 52, 0.15); opacity: 1; }
        .passe-active .passe-header { background: #dcfce7; color: #166534; }
        .passe-header { padding: 12px 18px; font-size: 18px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
        th, td { border: 1px solid #e5e7eb; padding: 8px; }
        th { background: #111827; color: white; font-weight: bold; }
        .col-player { text-align: left; padding-left: 12px; font-weight: bold; width: 15%; background: #f9fafb; }
        .col-total { font-weight: 900; background: #f3f4f6; }
        .bg-spiel-th { background: #1e293b; }
        .bg-sum { background: #dcfce7; font-weight: 900; }
        .highlight-cell { background-color: #fef9c3; font-weight: bold; }

        /* RANGLISTE DESIGN */
        .leaderboard-box { margin-top: 30px; border: 2px solid #e5e7eb; border-radius: 12px; overflow: hidden; background: #fff; }
        .leaderboard-header { background: #fef08a; padding: 12px 18px; font-size: 18px; font-weight: 900; color: #854d0e; display: flex; align-items: center; gap: 8px; }
        .col-rank { width: 15%; font-weight: bold; background: #f9fafb; text-align: center; }
        .col-lb-total { font-weight: 900; background: #fef9c3; text-align: center; }

        /* MODAL FÜR SPIELSTÄNDE LADEN */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; width: 500px; max-width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #14532d; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; }
        .history-item { padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; transition: background 0.2s; }
        .history-item:hover { background: #f3f4f6; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div>
                <h1>Differenzler-Jass Kontrollblatt</h1>
                <div class="sub-title">Zentrale Steuerung & Auswertung — Srv-Differenzler-01</div>
            </div>
            <div class="host-controls">
                <button id="btn-lock-toggle" onclick="toggleHostState()" class="btn btn-green">Host Freigeben</button>
                <button onclick="resetTable()" class="btn btn-red">Tisch zurücksetzen</button>
                <button onclick="saveToDatabase()" class="btn btn-blue">In Datenbank speichern</button>
                <button onclick="openHistoryModal()" class="btn btn-gray">📁 Spielstand laden</button>
            </div>
        </div>

        <div class="info-panel">
            <div class="room-box">
                <span style="font-size: 11px; text-transform: uppercase;">Raum-Code</span>
                <span id="display-room-code" class="room-code">JASS</span>
            </div>
            <div class="player-slot"><span>Spieler 1: <strong id="p1-name">Warten...</strong></span><span id="p1-dot" class="player-status-dot"></span></div>
            <div class="player-slot"><span>Spieler 2: <strong id="p2-name">Warten...</strong></span><span id="p2-dot" class="player-status-dot"></span></div>
            <div class="player-slot"><span>Spieler 3: <strong id="p3-name">Warten...</strong></span><span id="p3-dot" class="player-status-dot"></span></div>
            <div class="player-slot"><span>Spieler 4: <strong id="p4-name">Warten...</strong></span><span id="p4-dot" class="player-status-dot"></span></div>
        </div>

        <!-- TABELLEN FÜR PASSE 1 BIS 4 -->
        <div id="scorecards-container"></div>

        <!-- AKTUELLE RANGLISTE -->
        <div id="leaderboard-container"></div>
    </div>

    <!-- MODAL FÜR GESPEICHERTE SPIELSTÄNDE -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Gespeicherte Spielstände laden</h3>
                <button class="close-btn" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div id="history-list">
                <p style="text-align: center; color: #6b7280;">Lade Spielstände...</p>
            </div>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin);
        let currentGameState = null;
        let currentPlayers = {};
        let hostState = "Frei";

        socket.on('init', (data) => {
            hostState = data.hostState;
            currentPlayers = data.players || {};
            currentGameState = data.gameState;
            if(data.ROOM_CODE) document.getElementById('display-room-code').innerText = data.ROOM_CODE;
            updateHostUI();
        });

        socket.on('room_code_updated', (code) => {
            document.getElementById('display-room-code').innerText = code;
        });

        socket.on('players_updated', (players) => {
            currentPlayers = players;
            updatePlayersUI();
        });

        socket.on('game_state_updated', (gs) => {
            currentGameState = gs;
            renderAll();
        });

        socket.on('host_state_changed', (state) => {
            hostState = state;
            updateHostUI();
        });

        function toggleHostState() {
            let newState = (hostState === "Sperren") ? "Frei" : "Sperren";
            socket.emit('toggle_host', newState);
        }

        function updateHostUI() {
            const btn = document.getElementById('btn-lock-toggle');
            if (hostState === "Sperren") {
                btn.innerText = "Host Gesperrt";
                btn.className = "btn btn-red btn-lock-active";
            } else {
                btn.innerText = "Host Freigeben";
                btn.className = "btn btn-green";
            }
            updatePlayersUI();
            if(currentGameState) renderAll();
        }

        function updatePlayersUI() {
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`p${i}-name`).innerText = "Warten...";
                document.getElementById(`p${i}-dot`).className = "player-status-dot";
            }
            for (let token in currentPlayers) {
                let p = currentPlayers[token];
                let num = p.position.replace('Spieler', '');
                document.getElementById(`p${num}-name`).innerText = p.name;
                if (p.socketId) {
                    document.getElementById(`p${num}-dot`).className = "player-status-dot connected";
                }
            }
        }

        function resetTable() {
            if(confirm("Möchtest du den Tisch wirklich komplett zurücksetzen?")) {
                socket.emit('reset_table');
            }
        }

        function saveToDatabase() {
            fetch('/api/games/save', { method: 'POST' })
                .then(res => res.json())
                .then(data => alert(data.message || 'Erfolgreich gespeichert!'))
                .catch(err => alert('Fehler beim Speichern.'));
        }

        function openHistoryModal() {
            document.getElementById('history-modal').style.display = 'flex';
            const listContainer = document.getElementById('history-list');
            listContainer.innerHTML = '<p style="text-align: center; color: #6b7280;">Lade Spielstände...</p>';

            fetch('/api/games/history')
                .then(res => res.json())
                .then(games => {
                    if (!games || games.length === 0) {
                        listContainer.innerHTML = '<p style="text-align: center; color: #6b7280;">Keine gespeicherten Partien gefunden.</p>';
                        return;
                    }
                    let html = '';
                    games.forEach(g => {
                        let dateStr = new Date(g.createdAt).toLocaleString('de-CH');
                        let playerNames = Object.values(g.players || {}).map(pl => pl.name).join(', ') || 'Keine Spieler';
                        html += `
                            <div class="history-item">
                                <div>
                                    <strong style="font-size: 14px; color: #14532d;">${dateStr}</strong><br>
                                    <span style="font-size: 12px; color: #4b5563;">Spieler: ${playerNames}</span>
                                </div>
                                <button class="btn btn-green" style="padding: 6px 12px; font-size: 12px;" onclick="loadGame('${g._id}')">Laden</button>
                            </div>
                        `;
                    });
                    listContainer.innerHTML = html;
                })
                .catch(err => {
                    listContainer.innerHTML = '<p style="text-align: center; color: #dc2626;">Fehler beim Laden der Historie.</p>';
                });
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').style.display = 'none';
        }

        function loadGame(id) {
            if (confirm("Möchtest du diesen Spielstand wirklich laden? Aktuelle Eingaben werden überschrieben.")) {
                fetch(`/api/games/load/${id}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            alert('Spielstand erfolgreich wiederhergestellt!');
                            closeHistoryModal();
                        } else {
                            alert('Fehler: ' + (data.error || 'Unbekannt'));
                        }
                    })
                    .catch(err => alert('Fehler beim Wiederherstellen des Spielstands.'));
            }
        }

        function renderAll() {
            renderScorecards();
            renderLeaderboard();
        }

        function renderScorecards() {
            if (!currentGameState) return;
            const container = document.getElementById('scorecards-container');
            let html = '';

            let pNames = { Spieler1: "Spieler 1", Spieler2: "Spieler 2", Spieler3: "Spieler 3", Spieler4: "Spieler 4" };
            for (let token in currentPlayers) {
                pNames[currentPlayers[token].position] = currentPlayers[token].name;
            }

            for (let p = 1; p <= 4; p++) {
                let isCurrentPasse = (currentGameState.currentPasse === p);
                let passeClass = isCurrentPasse ? 'passe-active' : 'passe-inactive';

                html += `
                <div class="passe-container ${passeClass}">
                    <div class="passe-header">
                        <span>Passe ${p}</span>
                        <span style="font-size: 13px; font-weight: bold;">${isCurrentPasse ? '🟢 Aktive Passe' : 'Inaktiv'}</span>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th class="col-player">Spieler</th>
                `;
                for (let s = 1; s <= 4; s++) {
                    html += `<th colspan="3" class="bg-spiel-th">Spiel ${s}</th>`;
                }
                html += `<th>Total</th></tr>
                            <tr>
                                <th class="col-player"></th>`;
                for (let s = 1; s <= 4; s++) {
                    html += `<th>Gesch.</th><th>Spiel</th><th>Diff.</th>`;
                }
                html += `<th>Passe ${p}</th></tr>
                        </thead>
                        <tbody>`;

                let positions = ['Spieler1', 'Spieler2', 'Spieler3', 'Spieler4'];
                positions.forEach(pos => {
                    let name = pNames[pos];
                    html += `<tr><td class="col-player">${name}</td>`;
                    
                    let totalDiffPasse = 0;
                    for (let s = 1; s <= 4; s++) {
                        let cell = currentGameState.matrix[p][s];
                        let est = cell.estimates[pos];
                        let act = cell.actual[pos];
                        let diff = cell.diff[pos];

                        let estDisplay = est !== null ? est : '';
                        let actDisplay = act !== null ? act : '';
                        let diffDisplay = diff !== null ? diff : '';

                        if (est !== null && act === null) {
                            estDisplay = "OK";
                        }

                        let isCellActive = (currentGameState.currentPasse === p && currentGameState.currentSpiel === s);
                        let cellClass = isCellActive ? 'highlight-cell' : '';

                        html += `
                            <td class="${cellClass}">${estDisplay}</td>
                            <td class="${cellClass}">${actDisplay}</td>
                            <td class="${cellClass}">${diffDisplay}</td>
                        `;
                        if (diff !== null) totalDiffPasse += diff;
                    }
                    html += `<td class="col-total">${totalDiffPasse}</td></tr>`;
                });

                html += `<tr class="bg-sum"><td class="col-player">Total Punkte (157)</td>`;
                for (let s = 1; s <= 4; s++) {
                    let sumAct = 0;
                    let count = 0;
                    positions.forEach(pos => {
                        let act = currentGameState.matrix[p][s].actual[pos];
                        if (act !== null) {
                            sumAct += act;
                            count++;
                        }
                    });
                    html += `<td colspan="3" style="text-align: center; color: ${sumAct === 157 ? '#166534' : '#b91c1c'};">${count > 0 ? sumAct : '-'}</td>`;
                }
                html += `<td></td></tr>`;

                html += `</tbody></table></div>`;
            }
            container.innerHTML = html;
        }

        function renderLeaderboard() {
            if (!currentGameState) return;
            const container = document.getElementById('leaderboard-container');
            
            let pNames = { Spieler1: "Spieler 1", Spieler2: "Spieler 2", Spieler3: "Spieler 3", Spieler4: "Spieler 4" };
            for (let token in currentPlayers) {
                pNames[currentPlayers[token].position] = currentPlayers[token].name;
            }

            let positions = ['Spieler1', 'Spieler2', 'Spieler3', 'Spieler4'];
            let playerStats = positions.map(pos => {
                let name = pNames[pos];
                let passeTotals = [0, 0, 0, 0];
                let grandTotal = 0;

                for (let p = 1; p <= 4; p++) {
                    let pDiffSum = 0;
                    for (let s = 1; s <= 4; s++) {
                        let diff = currentGameState.matrix[p][s].diff[pos];
                        if (diff !== null) {
                            pDiffSum += diff;
                        }
                    }
                    passeTotals[p-1] = pDiffSum;
                    grandTotal += pDiffSum;
                }

                return { pos, name, passeTotals, grandTotal };
            });

            // Nach Gesamtdifferenz aufsteigend sortieren (weniger Differenz = bester Rang)
            playerStats.sort((a, b) => a.grandTotal - b.grandTotal);

            let html = `
            <div class="leaderboard-box">
                <div class="leaderboard-header">
                    🏆 Aktuelle Rangliste
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="col-rank">Rang</th>
                            <th class="col-player">Spieler</th>
                            <th>Passe 1</th>
                            <th>Passe 2</th>
                            <th>Passe 3</th>
                            <th>Passe 4</th>
                            <th class="col-lb-total">TOTAL</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            playerStats.forEach((stat, index) => {
                let rankText = `${index + 1}. Rang`;
                html += `
                    <tr>
                        <td class="col-rank">${rankText}</td>
                        <td class="col-player">${stat.name}</td>
                        <td>${stat.passeTotals[0]}</td>
                        <td>${stat.passeTotals[1]}</td>
                        <td>${stat.passeTotals[2]}</td>
                        <td>${stat.passeTotals[3]}</td>
                        <td class="col-lb-total">${stat.grandTotal}</td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
